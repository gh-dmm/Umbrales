<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visores Culturales - Carga Automatizada desde data/</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="container py-5">
        <h1 class="text-center mb-4 text-warning fw-bold">Módulo de Visores (Rutas Locales data/)</h1>
        <p class="text-center text-muted mb-5">Los botones leen directamente los archivos alojados en tu subcarpeta mediante peticiones asíncronas de JavaScript.</p>

        <div class="row justify-content-center gap-2 mb-4">
            <div class="col-auto">
                <button class="btn btn-primary shadow-sm" onclick="cargarRutaAutomatica(1, 'inah_museos', 'loteria')">
                    🏛️ Abrir: INAH Museos (ID: 1 - Lotería)
                </button>
            </div>
            <div class="col-auto">
                <button class="btn btn-success shadow-sm" onclick="cargarRutaAutomatica(2, 'monumentos', 'ficha')">
                    🏛️ Abrir: Monumentos (ID: 2 - Ficha)
                </button>
            </div>
            <div class="col-auto">
                <button class="btn btn-info text-dark shadow-sm" onclick="cargarRutaAutomatica(3, 'objetos_externos', 'loteria')">
                    🏛️ Abrir: Objetos Externos (ID: 3 - Lotería)
                </button>
            </div>
            <div class="col-auto">
                <button class="btn btn-danger shadow-sm" onclick="cargarRutaAutomatica(4, 'solicitudes', 'ficha')">
                    🏛️ Abrir: Solicitudes (ID: 4 - Ficha)
                </button>
            </div>
            <div class="col-auto">
                <button class="btn btn-secondary shadow-sm" onclick="limpiarTablero()">
                    🧹 Limpiar Tablero
                </button>
            </div>
        </div>

        <div id="status-carga" class="text-center mb-4 text-info small fw-bold font-monospace"></div>
        <hr class="border-secondary mb-5">

        <div class="row justify-content-center" id="tarjetas-container"></div>
    </div>

    <div class="modal fade" id="geminiChatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered text-dark">
            <div class="modal-content bg-light shadow-lg">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title text-warning" id="modal-titulo-acervo">Chat con Gemini</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-instancia-key">
                    <div id="modal-chat-box" class="p-3 border rounded bg-white mb-3 shadow-inner" style="max-height: 280px; overflow-y: auto;"></div>
                    <div class="form-group">
                        <label class="form-label fw-bold text-secondary">Aporta la información faltante para el Excel:</label>
                        <textarea id="modal-user-text" class="form-control border-secondary" rows="3" placeholder="Escribe los datos históricos aquí..."></textarea>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-warning fw-bold" onclick="ejecutarEnvioAporte()">Escanear con IA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="code.js"></script>
</body>
</html>
