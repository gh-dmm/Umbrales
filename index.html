<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diorama de Cartón Cultural - Selector HTML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="container py-4">
        <div id="status-carga" class="text-center mb-2 font-monospace text-dark small fw-bold"></div>

        <div id="escenario-quatri" class="carton-panel text-center mb-4">
            <h2 class="fw-bold mb-3 text-dark">📦 DISTRIBUIDOR CENTRAL (QUATRI)</h2>
            <div class="row justify-content-center gap-2">
                <div class="col-auto">
                    <button class="btn btn-carton" onclick="AppMuseo.cambiarEscenario('arqueologia')">Sala 1: Arqueología</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-carton" onclick="AppMuseo.cambiarEscenario('monumentos')">Sala 2: Monumentos</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-carton" onclick="AppMuseo.cambiarEscenario('solicitudes')">Sala 3: Documentos</button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-carton btn-casa" onclick="AppMuseo.cambiarEscenario('casa')">🏠 Entrar a la Casa</button>
                </div>
            </div>
        </div>

        <div id="escenario-arqueologia" class="escenario-cuarto d-none">
            <div class="carton-panel mb-4">
                <h3 class="fw-bold text-dark m-0">Sala 1: Arqueología e INAH</h3>
            </div>
            <div class="row justify-content-center gap-5 py-4 bg-carton-floor rounded">
                <div class="col-auto text-center">
                    <img src="https://images.unsplash.com/photo-1566121318318-7fba26543b35?w=200&q=80" class="objeto-clicker-3d" data-id="1" data-origen="inah_museos" data-visor="loteria">
                    <div class="badge-tag mt-2">Museo Regional (ID: 1)</div>
                </div>
                <div class="col-auto text-center">
                    <img src="img/img1.jpg" class="objeto-clicker-3d" data-id="1" data-origen="objetos_externos" data-visor="loteria">
                    <div class="badge-tag mt-2">El Penacho de Moctezuma (ID: 1)</div>
                </div>
            </div>
        </div>

        <div id="escenario-monumentos" class="escenario-cuarto d-none">
            <div class="carton-panel mb-4">
                <h3 class="fw-bold text-dark m-0">Sala 2: Arquitectura y Monumentos</h3>
            </div>
            <div class="row justify-content-center gap-5 py-4 bg-carton-floor rounded">
                <div class="col-auto text-center">
                    <img src="img/img2.jpeg" class="objeto-clicker-3d" data-id="4" data-origen="monumentos" data-visor="ficha">
                    <div class="badge-tag mt-2">Antiguo Acueducto (ID: 4)</div>
                </div>
            </div>
        </div>

        <div id="escenario-solicitudes" class="escenario-cuarto d-none">
            <div class="carton-panel mb-4">
                <h3 class="fw-bold text-dark m-0">Sala 3: Archivo General Histórico</h3>
            </div>
            <div class="row justify-content-center gap-5 py-4 bg-carton-floor rounded">
                <div class="col-auto text-center">
                    <img src="https://images.unsplash.com/photo-1455390582262-044cdead277a?w=400&q=80" class="objeto-clicker-3d" data-id="1" data-origen="solicitudes" data-visor="ficha">
                    <div class="badge-tag mt-2">Transcripción Paleográfica (ID: 1)</div>
                </div>
            </div>
        </div>

        <div id="escenario-casa" class="escenario-cuarto d-none">
            <div class="carton-panel mb-4">
                <h3 class="fw-bold text-dark m-0">🏠 Escenario: Casa de Colección</h3>
            </div>
            <div class="vitrina-carton-mueble p-4 rounded shadow-sm">
                <div class="row g-3 justify-content-center" id="contenedor-vitrina-items"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="acervoPopupModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content carton-popup border-0 position-relative">
                <button type="button" class="btn-close-carton" data-bs-dismiss="modal">&times;</button>
                <div id="popup-visor-body" class="d-flex flex-column align-items-center p-3"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="geminiChatModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content carton-popup border-0">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-dark" id="modal-titulo-acervo">Auditoría Gemini</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-instancia-key">
                    <div id="modal-chat-box" class="p-3 border rounded mb-3 shadow-inner font-monospace small" style="max-height: 250px; overflow-y: auto;"></div>
                    <div class="form-group">
                        <label class="form-label fw-bold text-dark">Aporta datos faltantes para el Excel:</label>
                        <textarea id="modal-user-text" class="form-control" rows="3" placeholder="Escribe aquí..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-success fw-bold text-white" onclick="AppMuseo.ejecutarEnvioAporte()">Escanear con IA</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="code.js?v=1.23"></script>
    <script>
    window.onload = () => {
        // Inicialización limpia de la clase controladora de escenarios
        window.AppMuseo = new AplicacionMuseo();
    };
</script>
</body>
</html>
